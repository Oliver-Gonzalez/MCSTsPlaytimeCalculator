<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playtime Calculator</title>
    <style>
        :root {
            --bg-color: #f9fafb;
            --card-bg: #ffffff;
            --text-color: #111827;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --border-focus: #9ca3af;
            --input-bg: #f3f4f6;
            --primary-btn: #111827;
            --primary-btn-hover: #374151;
            --error-bg: #fef2f2;
            --error-text: #991b1b;
            --error-border: #fee2e2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* 
           Base font size scaling: 
           Defaults to 20px for iPads/tablets to make all elements and text larger.
           Scales down to 16px on smaller mobile screens (under 600px width).
        */
        html {
            font-size: 20px; 
        }

        @media (max-width: 600px) {
            html {
                font-size: 16px; 
            }
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 800px; /* Expanded maximum width for iPad aspect ratios */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
        }

        h1 {
            text-align: center;
            margin-bottom: 0.4rem;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        @media (max-width: 550px) {
            .input-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .container {
                padding: 1.5rem;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-color);
        }

        /* Large touch targets for easier interaction */
        input[type="number"] {
            width: 100%;
            padding: 0.9rem 1.1rem;
            background-color: var(--input-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1.3rem; 
            font-weight: 500;
            transition: border-color 0.15s ease, background-color 0.15s ease;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--border-focus);
            background-color: var(--card-bg);
        }

        .btn-calculate {
            width: 100%;
            padding: 1.1rem;
            background-color: var(--primary-btn);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1.25rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: background-color 0.15s ease;
        }

        .btn-calculate:hover {
            background-color: var(--primary-btn-hover);
        }

        /* Highly visible Results Section */
        .results-card {
            background-color: var(--input-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            margin-top: 2rem;
            text-align: center;
            display: none;
        }

        .results-label {
            font-size: 1rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .primary-result {
            font-size: 4.5rem; /* Extremely large display for quick glances */
            font-weight: 800;
            margin: 0.8rem 0;
            letter-spacing: -0.04em;
            line-height: 1;
        }

        .timestamp-badge {
            display: inline-block;
            font-size: 0.9rem;
            color: var(--text-muted);
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 0.3rem 0.9rem;
            border-radius: 20px;
            margin-bottom: 1.2rem;
            font-weight: 500;
        }

        .secondary-results {
            display: flex;
            justify-content: space-around;
            border-top: 2px solid var(--border-color);
            padding-top: 1.5rem;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .secondary-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .secondary-label {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
        }

        .secondary-val {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .error-message {
            color: var(--error-text);
            background-color: var(--error-bg);
            border: 2px solid var(--error-border);
            padding: 1rem;
            border-radius: 8px;
            font-size: 1.1rem;
            text-align: center;
            margin-top: 1.5rem;
            display: none;
        }

        .btn-clear {
            width: 100%;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1.5rem;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .btn-clear:hover {
            background-color: var(--input-bg);
            color: var(--text-color);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Playtime Calculator</h1>
    <p class="subtitle">Enter parameters below to determine remaining playtime.</p>

    <form id="calcForm" onsubmit="return false;">
        <!-- Row 1: Wings -->
        <div class="input-grid">
            <div class="form-group">
                <label for="leftWing">Left Wing Fuel</label>
                <input type="number" id="leftWing" min="0" placeholder="0">
            </div>
            <div class="form-group">
                <label for="rightWing">Right Wing Fuel</label>
                <input type="number" id="rightWing" min="0" placeholder="0">
            </div>
        </div>

        <!-- Row 2: Fuselage & Bingo -->
        <div class="input-grid">
            <div class="form-group">
                <label for="fuselage">Fuselage Fuel</label>
                <input type="number" id="fuselage" min="0" placeholder="0">
            </div>
            <div class="form-group">
                <label for="bingo">Bingo Fuel</label>
                <input type="number" id="bingo" min="0" placeholder="0">
            </div>
        </div>

        <!-- Row 3: Mission Vars -->
        <div class="input-grid">
            <div class="form-group">
                <label for="timeToMOA">Time to MOA (mins)</label>
                <input type="number" id="timeToMOA" min="0" placeholder="0">
            </div>
            <div class="form-group">
                <label for="fuelFlow">Fuel Flow Per Hour</label>
                <input type="number" id="fuelFlow" min="1" placeholder="0">
            </div>
        </div>

        <button type="button" class="btn-calculate" onclick="handleCalculate()">Calculate Playtime</button>
    </form>

    <div class="error-message" id="errorDiv"></div>

    <!-- Active Results Area -->
    <div class="results-card" id="resultsCard">
        <span class="timestamp-badge" id="calcTimestamp">Calculated at: --:--:--</span>
        <br>
        <span class="results-label">Remaining Playtime (HH+MM)</span>
        <div class="primary-result" id="outPlaytimeFormatted">00+00</div>
        
        <div class="secondary-results">
            <div class="secondary-item">
                <span class="secondary-label">Total Fuel</span>
                <span class="secondary-val" id="outTotalFuel">--</span>
            </div>
            <div class="secondary-item">
                <span class="secondary-label">Usable Fuel</span>
                <span class="secondary-val" id="outUsableFuel">--</span>
            </div>
            <div class="secondary-item">
                <span class="secondary-label">Decimal Hours</span>
                <span class="secondary-val" id="outPlaytimeDecimal">--</span>
            </div>
        </div>
    </div>

    <button class="btn-clear" onclick="resetCalculator()">Clear Form</button>
</div>

<script>
    let countdownInterval = null;
    let initialPlaytimeMinutes = 0;
    let calculationTimestamp = null;

    let calculatedTotalFuel = 0;
    let calculatedUsableFuel = 0;

    function handleCalculate() {
        const errorDiv = document.getElementById('errorDiv');
        const resultsCard = document.getElementById('resultsCard');

        errorDiv.style.display = 'none';
        resultsCard.style.display = 'none';
        
        if (countdownInterval) {
            clearInterval(countdownInterval);
        }

        const leftWingRaw = document.getElementById('leftWing').value;
        const rightWingRaw = document.getElementById('rightWing').value;
        const fuselageRaw = document.getElementById('fuselage').value;
        const bingoRaw = document.getElementById('bingo').value;
        const timeToMOARaw = document.getElementById('timeToMOA').value;
        const fuelFlowRaw = document.getElementById('fuelFlow').value;

        if (!leftWingRaw || !rightWingRaw || !fuselageRaw || !bingoRaw || !timeToMOARaw || !fuelFlowRaw) {
            showError("Please fill in all inputs before calculating.");
            return;
        }

        const leftWing = parseFloat(leftWingRaw);
        const rightWing = parseFloat(rightWingRaw);
        const fuselage = parseFloat(fuselageRaw);
        const bingo = parseFloat(bingoRaw);
        const timeToMOA = parseFloat(timeToMOARaw);
        const fuelFlow = parseFloat(fuelFlowRaw);

        if (isNaN(leftWing) || isNaN(rightWing) || isNaN(fuselage) || isNaN(bingo) || isNaN(timeToMOA) || isNaN(fuelFlow)) {
            showError("Please enter valid numbers in all fields.");
            return;
        }

        if (fuelFlow <= 0) {
            showError("Fuel Flow must be greater than zero.");
            return;
        }

        calculatedTotalFuel = leftWing + rightWing + fuselage;
        calculatedUsableFuel = calculatedTotalFuel - bingo;

        if (calculatedUsableFuel < 0) {
            showError("Bingo fuel cannot exceed combined wing and fuselage fuel.");
            return;
        }

        const fuelFlowPerMin = fuelFlow / 60;
        const totalMinutesAvailable = calculatedUsableFuel / fuelFlowPerMin;
        initialPlaytimeMinutes = totalMinutesAvailable - timeToMOA;

        if (initialPlaytimeMinutes < 0) {
            showError("Transit time to MOA exceeds available flight time before hitting Bingo.");
            return;
        }

        calculationTimestamp = Date.now();
        
        const timeObject = new Date(calculationTimestamp);
        document.getElementById('calcTimestamp').textContent = "Calculated at: " + timeObject.toLocaleTimeString();

        resultsCard.style.display = 'block';
        updatePlaytimeDecay();
        
        // Dynamic interval update (runs every 2 seconds to check clock state)
        countdownInterval = setInterval(updatePlaytimeDecay, 2000);
    }

    function updatePlaytimeDecay() {
        if (!calculationTimestamp) return;

        const elapsedMilliseconds = Date.now() - calculationTimestamp;
        const elapsedMinutes = elapsedMilliseconds / 60000;

        const currentPlaytimeMinutes = initialPlaytimeMinutes - elapsedMinutes;

        if (currentPlaytimeMinutes <= 0) {
            document.getElementById('outPlaytimeFormatted').textContent = "00+00";
            document.getElementById('outPlaytimeDecimal').textContent = "0.0000 hrs";
            if (countdownInterval) clearInterval(countdownInterval);
            return;
        }

        const totalMinutes = Math.max(0, Math.floor(currentPlaytimeMinutes));
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;

        const formattedHours = String(hours).padStart(2, '0');
        const formattedMinutes = String(minutes).padStart(2, '0');

        const currentPlaytimeHoursDecimal = currentPlaytimeMinutes / 60;

        document.getElementById('outPlaytimeFormatted').textContent = `${formattedHours}+${formattedMinutes}`;
        document.getElementById('outPlaytimeDecimal').textContent = currentPlaytimeHoursDecimal.toFixed(4) + ' hrs';
        document.getElementById('outTotalFuel').textContent = calculatedTotalFuel.toLocaleString(undefined, {maximumFractionDigits: 0});
        document.getElementById('outUsableFuel').textContent = calculatedUsableFuel.toLocaleString(undefined, {maximumFractionDigits: 0});
    }

    function showError(message) {
        const errorDiv = document.getElementById('errorDiv');
        errorDiv.textContent = message;
        errorDiv.style.display = 'block';
        document.getElementById('resultsCard').style.display = 'none';
    }

    function resetCalculator() {
        if (countdownInterval) clearInterval(countdownInterval);
        document.getElementById('calcForm').reset();
        document.getElementById('errorDiv').style.display = 'none';
        document.getElementById('resultsCard').style.display = 'none';
        
        initialPlaytimeMinutes = 0;
        calculationTimestamp = null;
    }
</script>

</body>
</html>
